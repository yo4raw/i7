name: Deploy to Cloudflare Workers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # default branch は develop のため、Run workflow の既定選択は develop になる。
      # 手動実行で誤って未リリースの develop を本番へ出さないよう、main 以外を弾く。
      - name: Guard manual dispatch to main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          echo "::error::手動デプロイは main からのみ許可されています（選択されたのは ${SELECTED_REF}）。"
          echo "Run workflow の 'Use workflow from' で main を選び直してください。"
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      # Bing / DuckDuckGo 等へ更新を通知する (ADR 0063)。
      # 送信対象は人手のリリース (vX.Y.0) のみ。判定はスクリプト側で行う。
      # 通知の失敗でデプロイ結果を覆さない。
      - name: Notify IndexNow
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/notify-indexnow.mjs
