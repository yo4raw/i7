name: Sync main to develop

# main に入った変更（アセット自動取り込み / hotfix / リリース）を develop へ取り込み、
# 「main は常に develop の祖先」という不変条件を保つ。
# これによりリリースを develop -> main の fast-forward で行える（main にマージコミットが載らない）。
on:
  push:
    branches: [main]
  # 画像取得 cron 4 本から呼ばれる。cron の auto-merge は GITHUB_TOKEN 由来のため
  # main への push イベントを発火せず、上の push トリガーでは起動しないため。
  workflow_call:
  # 衝突や push レースで失敗したあと、main への次の push を待たずに手動で再実行するため
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge main into develop
        run: |
          set -e -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop already contains main; nothing to do"
            exit 0
          fi
          git merge --no-edit origin/main
          git push origin HEAD:develop
