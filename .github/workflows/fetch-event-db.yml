name: Fetch event DB

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-event-db:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.cpr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # default branch が develop になっても main を見続ける。
          # PR の base だけでなく、タグ採番が参照する origin/main の解決にも効く
          # （checkout は checkout したブランチ向けに remote.origin.fetch を設定するため）。
          ref: main

      - name: Download event DB CSV
        id: fetch
        shell: bash
        run: |
          mkdir -p public/events
          DEST="public/events/events.csv"
          TMP="$(mktemp)"

          HTTP_CODE=$(curl -sS -X POST \
            --connect-timeout 10 --max-time 60 \
            --data 'db=event&code=utf8' \
            -o "$TMP" -w "%{http_code}" \
            'https://i7.step-on-dream.net/admin/download.php' || true)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Download failed: HTTP $HTTP_CODE"
            exit 1
          fi

          SIZE=$(wc -c < "$TMP" | tr -d ' ')
          if [ "$SIZE" -lt 1024 ]; then
            echo "Downloaded file too small: $SIZE bytes"
            exit 1
          fi
          if ! head -1 "$TMP" | grep -q 'eventname'; then
            echo "Header validation failed (expected 'eventname' in first line)"
            head -3 "$TMP"
            exit 1
          fi

          mv "$TMP" "$DEST"

          ROWS=$(($(wc -l < "$DEST") - 1))
          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          # base の既定値は「checkout されたブランチ」。default branch 変更の影響を受けないよう明示する
          base: main
          add-paths: public/events/events.csv
          commit-message: "🗃️ イベント DB CSV を更新"
          branch: auto/update-event-db
          delete-branch: true
          title: "🗃️ イベント DB を更新 (${{ steps.fetch.outputs.rows }} 行)"
          body: |
            ## Summary
            Automatically fetched event DB from source server.

            - **Source**: `POST https://i7.step-on-dream.net/admin/download.php` (`db=event`, `code=utf8`)
            - **Destination**: `public/events/events.csv`
            - **Rows**: ${{ steps.fetch.outputs.rows }}
            - **Size**: ${{ steps.fetch.outputs.size }} bytes

      - name: Auto-merge PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch

  # auto-merge は GITHUB_TOKEN 由来のため main への push イベントを発火せず、
  # tag-release.yml の push トリガーでは起動しない。reusable workflow として直接呼び出す。
  tag-release:
    needs: fetch-event-db
    if: needs.fetch-event-db.outputs.merged
    permissions:
      contents: read
    uses: ./.github/workflows/tag-release.yml
    with:
      bump: patch
    secrets: inherit

  # 同上。back-merge も cron 経由では push トリガーで起動しないため直接呼び出す。
  # これが無いと develop が main から取り残され、リリースの fast-forward が通らなくなる。
  sync-main-to-develop:
    needs: fetch-event-db
    if: needs.fetch-event-db.outputs.merged
    permissions:
      contents: write
    uses: ./.github/workflows/sync-main-to-develop.yml
    secrets: inherit
