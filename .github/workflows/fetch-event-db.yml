name: Fetch event DB

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-event-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # default branch が develop になっても main を見続ける。
          # PR の base だけでなく、タグ採番が参照する origin/main の解決にも効く
          # （checkout は checkout したブランチ向けに remote.origin.fetch を設定するため）。
          ref: main

      - name: Download event DB CSV
        id: fetch
        shell: bash
        run: |
          mkdir -p public/events
          DEST="public/events/events.csv"
          TMP="$(mktemp)"

          HTTP_CODE=$(curl -sS -X POST \
            --connect-timeout 10 --max-time 60 \
            --data 'db=event&code=utf8' \
            -o "$TMP" -w "%{http_code}" \
            'https://i7.step-on-dream.net/admin/download.php' || true)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Download failed: HTTP $HTTP_CODE"
            exit 1
          fi

          SIZE=$(wc -c < "$TMP" | tr -d ' ')
          if [ "$SIZE" -lt 1024 ]; then
            echo "Downloaded file too small: $SIZE bytes"
            exit 1
          fi
          if ! head -1 "$TMP" | grep -q 'eventname'; then
            echo "Header validation failed (expected 'eventname' in first line)"
            head -3 "$TMP"
            exit 1
          fi

          mv "$TMP" "$DEST"

          ROWS=$(($(wc -l < "$DEST") - 1))
          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          # base の既定値は「checkout されたブランチ」。default branch 変更の影響を受けないよう明示する
          base: main
          add-paths: public/events/events.csv
          commit-message: "Update event DB CSV"
          branch: auto/update-event-db
          delete-branch: true
          title: "Update event DB (${{ steps.fetch.outputs.rows }} rows)"
          body: |
            ## Summary
            Automatically fetched event DB from source server.

            - **Source**: `POST https://i7.step-on-dream.net/admin/download.php` (`db=event`, `code=utf8`)
            - **Destination**: `public/events/events.csv`
            - **Rows**: ${{ steps.fetch.outputs.rows }}
            - **Size**: ${{ steps.fetch.outputs.size }} bytes

      - name: Auto-merge PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch

      - name: Bump tag and trigger release/deploy
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -e -o pipefail
          git fetch --tags origin
          git fetch origin main
          SHA=$(git rev-parse origin/main)
          # 同一コミットに既に vX.Y.Z が付いていれば、二重タグ（= 重複リリース/デプロイ）を避けて抜ける。
          # 4 本の fetch 系ワークフローが毎時同時に走るため、後続分がここで止まる。
          if git tag --points-at "$SHA" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$SHA is already tagged; skip"
            exit 0
          fi
          LATEST=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
          NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Latest: $LATEST  ->  New: $NEW_TAG  ($SHA)"
          # タグ作成は git push ではなく GitHub API で行う。
          # actions/checkout v7 は認証情報を includeIf.gitdir 経由の別ファイルに置くようになったため、
          # local の extraheader を unset する従来の回避策が効かず、push が GITHUB_TOKEN 扱いになる。
          # GITHUB_TOKEN 由来の push は deploy.yml / release.yml をトリガーしない。
          # API 経由なら RELEASE_PAT が確実に使われ、ローカル git の認証設定に依存しない。
          gh api --method POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/$NEW_TAG" -f sha="$SHA"
