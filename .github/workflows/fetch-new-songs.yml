name: Fetch new song images

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-songs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Fetch missing song images
        id: fetch
        shell: bash
        run: |
          set -e -o pipefail
          mkdir -p public/assets/songs
          node scripts/fetch-song-images.mjs

          NEW_FILES=$(git ls-files --others --exclude-standard public/assets/songs/ || true)
          NEW_COUNT=$(printf '%s\n' "$NEW_FILES" | grep -c '\.webp$' || true)
          NEW_IDS=$(printf '%s\n' "$NEW_FILES" \
            | grep -oE '[0-9]+\.webp$' \
            | sed 's/\.webp$//' \
            | sort -n \
            | paste -sd ', ' - || true)

          echo "Downloaded: $NEW_COUNT"
          echo "New IDs: $NEW_IDS"
          echo "downloaded=$NEW_COUNT" >> "$GITHUB_OUTPUT"
          echo "new_ids=$NEW_IDS" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: cpr
        if: steps.fetch.outputs.downloaded != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: public/assets/songs/
          commit-message: "Add song images: ${{ steps.fetch.outputs.new_ids }}"
          branch: auto/add-songs-${{ github.run_id }}
          delete-branch: true
          title: "Add song image(s): ${{ steps.fetch.outputs.downloaded }} file(s)"
          body: |
            ## Summary
            Automatically fetched new song cover images from IDOLiSH7 Wiki.

            - **Downloaded**: ${{ steps.fetch.outputs.downloaded }}
            - **New IDs**: ${{ steps.fetch.outputs.new_ids }}

      - name: Auto-merge PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch

      - name: Bump tag and trigger release/deploy
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -e -o pipefail
          git fetch --tags origin
          git fetch origin main
          SHA=$(git rev-parse origin/main)
          # 同一コミットに既に vX.Y.Z が付いていれば、二重タグ（= 重複リリース/デプロイ）を避けて抜ける。
          # 4 本の fetch 系ワークフローが毎時同時に走るため、後続分がここで止まる。
          if git tag --points-at "$SHA" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$SHA is already tagged; skip"
            exit 0
          fi
          LATEST=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
          NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Latest: $LATEST  ->  New: $NEW_TAG  ($SHA)"
          # タグ作成は git push ではなく GitHub API で行う。
          # actions/checkout v7 は認証情報を includeIf.gitdir 経由の別ファイルに置くようになったため、
          # local の extraheader を unset する従来の回避策が効かず、push が GITHUB_TOKEN 扱いになる。
          # GITHUB_TOKEN 由来の push は deploy.yml / release.yml をトリガーしない。
          # API 経由なら RELEASE_PAT が確実に使われ、ローカル git の認証設定に依存しない。
          gh api --method POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/$NEW_TAG" -f sha="$SHA"
