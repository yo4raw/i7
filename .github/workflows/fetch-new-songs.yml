name: Fetch new song images

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-songs:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.cpr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # default branch が develop になっても main を見続ける。
          # PR の base だけでなく、タグ採番が参照する origin/main の解決にも効く
          # （checkout は checkout したブランチ向けに remote.origin.fetch を設定するため）。
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Fetch missing song images
        id: fetch
        shell: bash
        run: |
          set -e -o pipefail
          mkdir -p public/assets/songs
          node scripts/fetch-song-images.mjs

          NEW_FILES=$(git ls-files --others --exclude-standard public/assets/songs/ || true)
          NEW_COUNT=$(printf '%s\n' "$NEW_FILES" | grep -c '\.webp$' || true)
          NEW_IDS=$(printf '%s\n' "$NEW_FILES" \
            | grep -oE '[0-9]+\.webp$' \
            | sed 's/\.webp$//' \
            | sort -n \
            | paste -sd ', ' - || true)

          echo "Downloaded: $NEW_COUNT"
          echo "New IDs: $NEW_IDS"
          echo "downloaded=$NEW_COUNT" >> "$GITHUB_OUTPUT"
          echo "new_ids=$NEW_IDS" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: cpr
        if: steps.fetch.outputs.downloaded != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          # base の既定値は「checkout されたブランチ」。default branch 変更の影響を受けないよう明示する
          base: main
          add-paths: public/assets/songs/
          commit-message: "Add song images: ${{ steps.fetch.outputs.new_ids }}"
          branch: auto/add-songs-${{ github.run_id }}
          delete-branch: true
          title: "Add song image(s): ${{ steps.fetch.outputs.downloaded }} file(s)"
          body: |
            ## Summary
            Automatically fetched new song cover images from IDOLiSH7 Wiki.

            - **Downloaded**: ${{ steps.fetch.outputs.downloaded }}
            - **New IDs**: ${{ steps.fetch.outputs.new_ids }}

      - name: Auto-merge PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch

  # auto-merge は GITHUB_TOKEN 由来のため main への push イベントを発火せず、
  # tag-release.yml の push トリガーでは起動しない。reusable workflow として直接呼び出す。
  tag-release:
    needs: fetch-songs
    if: needs.fetch-songs.outputs.merged
    permissions:
      contents: read
    uses: ./.github/workflows/tag-release.yml
    with:
      bump: patch
    secrets: inherit
